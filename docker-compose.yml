version: '3.8'

services:
  manetho:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      - "com.manetho.description=Ancient Egypt Historical Blog"
